<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folio inclusif — Charte graphique</title>
  <meta name="description" content="Charte graphique de Folio inclusif — refonte inclusive de la collection Folio de Gallimard.">

  <style>
    :root {
      /* Palette Folio inclusif — Aube */
      --blanc-antoine: #f5f1e8;
      --rouge-gaston: #c1272d;
      --nuit-baudelairienne: #1a1a1a;
      --shadow-soft: 0 20px 60px rgba(26, 26, 26, 0.18);
      --shadow-page: 0 4px 24px rgba(26, 26, 26, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--blanc-antoine);
      font-family: Verdana, Geneva, sans-serif;
      color: var(--nuit-baudelairienne);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 64px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      max-width: 720px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--rouge-gaston);
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: normal;
      letter-spacing: 0.02em;
      margin: 0 0 16px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 13px;
      line-height: 1.7;
      color: rgba(26, 26, 26, 0.7);
      margin: 0;
    }

    /* Flipbook container */
    #flipbook-stage {
      width: 100%;
      max-width: 920px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(var(--shadow-soft));
      margin-bottom: 32px;
    }

    #flipbook {
      background: transparent;
    }

    #flipbook .page-img {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--blanc-antoine);
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--nuit-baudelairienne);
      color: var(--nuit-baudelairienne);
      font-family: Verdana, sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--nuit-baudelairienne);
      color: var(--blanc-antoine);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-counter {
      font-size: 12px;
      letter-spacing: 0.1em;
      min-width: 80px;
      text-align: center;
      color: rgba(26, 26, 26, 0.7);
    }

    .page-counter .current {
      color: var(--rouge-gaston);
    }

    /* Loading state */
    .loader {
      position: fixed;
      inset: 0;
      background: var(--blanc-antoine);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.4s ease;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-text {
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--rouge-gaston);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    footer {
      margin-top: 48px;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(26, 26, 26, 0.5);
      text-align: center;
    }

    /* Hint discret */
    .hint {
      font-size: 11px;
      color: rgba(26, 26, 26, 0.5);
      margin-top: 16px;
      letter-spacing: 0.05em;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="loader" id="loader">
    <div class="loader-text">Chargement</div>
  </div>

  <div class="page-wrap">
    <header>
      <div class="eyebrow">Charte graphique</div>
      <h1>Folio inclusif</h1>
      <p class="subtitle">Refonte inclusive de la collection Folio.<br>Cliquez sur les coins ou utilisez les flèches pour feuilleter.</p>
    </header>

    <div id="flipbook-stage">
      <div id="flipbook"></div>
    </div>

    <div class="controls">
      <button class="btn" id="prev-btn" aria-label="Page précédente">← Précédent</button>
      <div class="page-counter">
        <span class="current" id="current-page">1</span> / <span id="total-pages">108</span>
      </div>
      <button class="btn" id="next-btn" aria-label="Page suivante">Suivant →</button>
    </div>

    <p class="hint">Astuce : utilisez les flèches ← → du clavier</p>

    <footer>© Aurélie — Tous droits réservés</footer>
  </div>

  <!-- StPageFlip : librairie open source -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <script>
    const TOTAL_PAGES = 108;
    const flipbookEl = document.getElementById('flipbook');
    const loader = document.getElementById('loader');
    const currentPageEl = document.getElementById('current-page');
    const totalPagesEl = document.getElementById('total-pages');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    totalPagesEl.textContent = TOTAL_PAGES;

    // Calcule dimensions adaptées (ratio 306:504 du PDF)
    function getDimensions() {
      const maxWidth = Math.min(window.innerWidth - 48, 880);
      const isMobile = window.innerWidth < 720;
      // En mobile : une seule page, en desktop : double page
      const pageWidth = isMobile ? maxWidth : (maxWidth - 40) / 2;
      const pageHeight = pageWidth * (504 / 306);
      return { pageWidth, pageHeight, isMobile };
    }

    const { pageWidth, pageHeight, isMobile } = getDimensions();

    const pageFlip = new St.PageFlip(flipbookEl, {
      width: pageWidth,
      height: pageHeight,
      size: 'fixed',
      minWidth: 200,
      maxWidth: 600,
      minHeight: 330,
      maxHeight: 990,
      drawShadow: true,
      flippingTime: 800,
      usePortrait: isMobile,
      autoSize: false,
      maxShadowOpacity: 0.5,
      showCover: true,
      mobileScrollSupport: true,
      swipeDistance: 30,
    });

    // Génère la liste des images de pages
    const pageUrls = [];
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      const padded = String(i).padStart(3, '0');
      pageUrls.push(`pages/page-${padded}.jpg`);
    }

    // Charge les pages dans le flipbook
    pageFlip.loadFromImages(pageUrls);

    // Met à jour le compteur de pages
    pageFlip.on('flip', (e) => {
      currentPageEl.textContent = e.data + 1;
      prevBtn.disabled = e.data === 0;
      nextBtn.disabled = e.data >= TOTAL_PAGES - 1;
    });

    // Cache le loader après initialisation
    pageFlip.on('init', () => {
      setTimeout(() => loader.classList.add('hidden'), 300);
    });

    // Contrôles boutons
    prevBtn.addEventListener('click', () => pageFlip.flipPrev());
    nextBtn.addEventListener('click', () => pageFlip.flipNext());

    // Contrôles clavier
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') pageFlip.flipPrev();
      if (e.key === 'ArrowRight') pageFlip.flipNext();
    });

    // Désactive le bouton précédent au départ
    prevBtn.disabled = true;

    // Fallback si la librairie tarde
    setTimeout(() => loader.classList.add('hidden'), 3000);
  </script>

</body>
</html>
